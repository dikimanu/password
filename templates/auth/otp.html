<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body class="page-otp">
<main class="container auth-box">
    <h2>OTP Verification</h2>
    <p>{{ message }}</p>
    
    <form method="POST" action="{{ url_for('auth.verify_otp_route') }}">
        <input type="hidden" name="user_id" value="{{ user_id }}">
        <label>Enter OTP</label>
        <input type="text" name="code" required>
        <button type="submit">Verify</button>
    </form>

    <!-- Resend OTP Form -->
    <form method="POST" action="{{ url_for('auth.resend_otp_route') }}" style="margin-top: 15px; text-align: center;">
        <input type="hidden" name="user_id" value="{{ user_id }}">
        <input type="hidden" name="identifier" value="{{ identifier }}">
        <button type="submit" style="background: transparent; border: none; color: #4a90e2; text-decoration: underline; cursor: pointer; font-size: 14px;">
            Didn't receive code? Resend OTP
        </button>
    </form>

    {% if has_biometric %}
    <hr style="margin: 15px 0; border:0; border-top:1px solid #ddd;">
    <button type="button" id="bio-verify-btn" style="width: 100%; margin-top: 5px; background-color: #2b7a78; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">
        🔑 Verify with Face / Fingerprint
    </button>
    <script src="{{ url_for('static', filename='js/biometric.js') }}"></script>
    <script>
    document.getElementById('bio-verify-btn').addEventListener('click', () => {
        authenticateBiometric("{{ user_id }}", "{{ identifier }}");
    });
    </script>
    {% endif %}
</main>
<script src="{{ url_for('static', filename='js/otp.js') }}"></script>
</body>
</html>
