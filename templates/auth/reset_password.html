<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-login">
<main class="container auth-box">
    <h2>Reset Password</h2>

    {% if invalid %}
        <p class="error">This reset link is invalid or has expired.</p>
        <p><a href="{{ url_for('auth.forgot_password') }}">Request a new link</a></p>
    {% elif success %}
        <p class="success">Your password has been reset successfully.</p>
        <p><a href="{{ url_for('auth.login_page') }}">Go to login</a></p>
    {% else %}
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <label>New Password</label>
            <input type="password" name="password" required>
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required>
            <button type="submit">Reset Password</button>
        </form>
    {% endif %}
</main>
</body>
</html>
