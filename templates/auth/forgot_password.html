<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-login">
<main class="container auth-box">
    <h2>Forgot Password</h2>
    {% if message %}
        <p class="success">{{ message }}</p>
    {% else %}
        <p>Enter your registered email and we'll send you a password reset link.</p>
        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <label>Email</label>
            <input type="email" name="email" required>
            <button type="submit">Send Reset Link</button>
        </form>
    {% endif %}
    <p><a href="{{ url_for('auth.login_page') }}">Back to login</a></p>
</main>
</body>
</html>
